<!DOCTYPE html>
<html lang="en" dir="ltr">
	<head>
		<meta charset="utf-8">
		<title>Pull Request Summary Generator</title>
		<style>
			form {
				display: inline-grid;
				grid-template-columns: 1fr 1fr;
				gap: 0.5rem;
				width: 100%;
				max-width: 800px;
			}
			button { grid-column: 1/3; }
			#copy { margin: 1rem 0; }
			#copy:has(+ #output:empty) { display: none; }
			#output:not(:empty) { border: 2px dashed #000; }
		</style>
	</head>
	<body>
		<h1>Pull Request Summary Generator</h1>
		<form>
			<label for="token">Github Token</label>
			<input id="token" name="token" required type="password" placeholder="GITHUB_TOKEN">
			<label for="repos">Repositories</label>
			<textarea id="repos" name="repos" required placeholder="owner/repository
owner2/repository2
owner3/repository3
" rows="5"></textarea>
			<button>Generate</button>
		</form>
		<pre id="logger"></pre>
		<button id="copy">Copy preview to clipboard</button>
		<div id="output"></div>
		<script src="./main.js"></script>
	</body>
</html>
